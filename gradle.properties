# ==== Gradle 运行时 ====
# MC 26.x 需要 JDK 25。JDK 位置由 build.bat / 环境变量 JAVA_HOME 提供，
# 这里**故意不写** org.gradle.java.home：写死就是个人机器专属配置，
# 别人 clone 下来第一步就报 "Java home directory does not exist"。
# 想固定某个 JDK：写进 ~/.gradle/gradle.properties，或命令行 -Dorg.gradle.java.home=...
#
# 本机所在网络（手机热点）出境 IPv4 到境外站点超时、IPv6 正常：
# Java 默认按 DNS 顺序先试 IPv4 会卡死 → 强制优先 IPv6，否则 Loom/依赖下载全部失败。
# （家庭宽带/国内直连可删这两行，无碍。）
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv6Addresses=true
systemProp.java.net.preferIPv6Addresses=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false

# 本机到部分站点不稳，缩短超时避免构建挂死
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=4

# ==== Fabric（与 26.3-Fabric生存111 实例对齐）====
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21
fabric_api_version=0.162.0+26.3

# ==== Kotlin / iroh ====
# Kotlin 2.2.21：最高支持 JVM_24 目标（配合 MC 的 JDK 25 运行）
kotlin_version=2.2.21
# iroh 的 Kotlin 绑定（Maven Central: computer.iroh:iroh）
iroh_version=1.2.0
coroutines_version=1.9.0

# ==== Mod 属性 ====
# 0.1.2（开发中）：发布文件名规范 + CI 权限修复 + 重复状态文案修复。
# 与 release tag v0.1.2 一一对应。
mod_version=0.1.2
maven_group=com.p2plan
# 产物名规范 = <mod名>-mc<游戏版本>-<加载器>-<mod版本>，例 p2plan_iroh-mc26.3-fabric-0.1.2.jar。
# 这里只写「mod 名」这一段；mc/加载器两段由 build.gradle 从上面的 minecraft_version 拼出来，
# 免得改了游戏版本却忘了改文件名（这种不一致只有下载的玩家会发现）。
archives_base_name=p2plan_iroh